<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101817">
<meta name="description" content="Brotherhood Open – das jährliche Golfduell zwischen Julian und Marcel Glatter. Ergebnisse, Spieltage, Spieler und Historie seit 2024.">
<title>Brotherhood Open — Zwei Brüder. Ein Titel.</title>

<style>
:root{
  --bg:#101817;--surface:#182321;--surface2:#202e2a;
  --line:#35443d;--text:#f2f0e8;--muted:#b2beb5;
  --gold:#e1c18a;--julian:#a7caff;--marcel:#9bddbd;
  --radius:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.6;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button,select{cursor:pointer}
button{color:inherit}
button:disabled{cursor:not-allowed;opacity:.5}
a:focus-visible,button:focus-visible,input:focus-visible,
select:focus-visible,summary:focus-visible{
  outline:3px solid var(--gold);outline-offset:4px;
}
img{display:block;max-width:100%}
h1,h2,h3,p{margin-top:0}
h1,h2,h3{line-height:1.12}
h1{
  font-size:clamp(2.6rem,6.8vw,6rem);
  letter-spacing:-.065em;margin-bottom:24px;
}
h2{font-size:clamp(1.8rem,3.5vw,3rem);letter-spacing:-.045em}
h3{font-size:1.2rem;letter-spacing:-.025em}
small{font-size:.8rem}
.container{width:min(1180px,calc(100% - 48px));margin:auto}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.julian{color:var(--julian)}
.marcel{color:var(--marcel)}
.caption{color:var(--muted);font-size:.8rem}
.eyebrow{
  display:block;margin-bottom:20px;color:var(--gold);
  text-transform:uppercase;letter-spacing:.2em;
  font-size:.72rem;font-weight:750;
}
.skip{
  position:absolute;left:16px;top:-100px;z-index:20;
  padding:12px;background:var(--gold);color:var(--bg);
}
.skip:focus{top:12px}
header{border-bottom:1px solid var(--line);background:var(--bg)}
.header-row{
  display:flex;align-items:center;justify-content:space-between;
  min-height:88px;gap:24px;
}
.brand{display:flex;align-items:center;gap:13px}
.monogram{
  display:grid;place-items:center;width:43px;height:43px;
  flex-shrink:0;border:1px solid var(--gold);color:var(--gold);
  font-family:Georgia,serif;font-size:23px;
}
.wordmark{line-height:1.1;font-size:.8rem;font-weight:800;letter-spacing:.13em}
.wordmark small{
  display:block;margin-top:7px;color:var(--muted);
  font-size:.59rem;letter-spacing:.22em;font-weight:500;
}
nav{display:flex;gap:22px;align-items:center}
nav a{padding:12px 0;color:var(--muted);font-size:.82rem}
nav a:hover,nav a[aria-current="page"]{color:var(--gold)}
select{
  padding:10px 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);
  color:var(--text);color-scheme:dark;
}
main{min-height:70vh;padding-bottom:70px}
main:focus{outline:none}
.page-head{padding:55px 0 30px}
.page-head h1{font-size:clamp(2.6rem,5vw,4.6rem)}
.page-head p{max-width:720px;color:var(--muted)}
.hero{
  display:grid;grid-template-columns:1.1fr 1fr;gap:60px;
  align-items:center;padding:60px 0 65px;
}
.hero p{max-width:460px;color:var(--muted)}
.hero-title em{color:var(--gold);font-family:Georgia,serif;font-weight:400}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{
  display:inline-flex;justify-content:center;align-items:center;gap:10px;
  padding:13px 20px;border-radius:8px;border:1px solid var(--line);
  background:transparent;font-size:.85rem;font-weight:650;
  transition:transform .2s,background .2s;
}
.btn:hover:not(:disabled){background:var(--surface2);transform:translateY(-2px)}
.btn.primary{background:var(--gold);color:#17211d;border-color:var(--gold)}
.btn.primary:hover:not(:disabled){background:#efd4a8}
.btn.small{padding:8px 12px;font-size:.78rem}
.hero-right{display:flex;flex-direction:column;gap:24px;min-width:0}
.hero-trophy{
  position:relative;isolation:isolate;display:flex;
  flex-direction:column;align-items:center;margin:0;padding:12px 20px 0;
}
.hero-trophy::before{
  content:"";position:absolute;z-index:-1;width:min(100%,340px);
  height:280px;top:45%;left:50%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(225,193,138,.17),transparent 72%);
  pointer-events:none;
}
.trophy-image{
  width:auto;height:290px;max-width:100%;object-fit:contain;
  filter:drop-shadow(0 16px 20px rgba(0,0,0,.4));
}
.hero-trophy figcaption{
  margin-top:18px;color:var(--gold);font-size:.7rem;
  font-weight:650;letter-spacing:.22em;text-align:center;
}
.trophy-placeholder{
  max-width:280px;padding:24px;border:1px dashed var(--line);
  border-radius:12px;color:var(--muted);font-size:.8rem;text-align:center;
}
.scoreboard{
  padding:30px;border:1px solid #596047;border-radius:var(--radius);
  background:linear-gradient(145deg,#24372e,#17231f);
}
.score-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.pill{
  display:inline-block;padding:6px 10px;border-radius:30px;
  background:rgba(225,193,138,.1);color:var(--gold);
  font-size:.67rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;
}
.duel{
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  gap:12px;align-items:center;text-align:center;margin:28px 0;
}
.avatar{
  width:77px;height:77px;border-radius:50%;object-fit:cover;
  border:2px solid var(--line);margin:0 auto 12px;
}
.avatar.jg{object-position:50% 48%;border-color:var(--julian)}
.avatar.mg{object-position:65% 39%;border-color:var(--marcel)}
.duel-name{font-size:.88rem;font-weight:650}
.duel-name small{display:block;color:var(--muted);font-weight:400}
.score-number{
  margin-top:10px;font-size:clamp(2.7rem,4.7vw,4.8rem);
  line-height:1.15;font-weight:750;letter-spacing:-.07em;
  font-variant-numeric:tabular-nums;
}
.vs{color:var(--muted);font-family:Georgia,serif;font-style:italic}
.score-note{text-align:center;border-top:1px solid var(--line);padding-top:20px}
.score-note p{margin:0 auto;font-size:.83rem}
.score-note p+p{margin-top:8px}
.grid{display:grid;gap:20px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{
  min-width:0;padding:26px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);
}
.card p:last-child{margin-bottom:0}
.stat-label{display:block;color:var(--muted);font-size:.78rem}
.stat-value{
  display:block;margin:8px 0 3px;font-size:2.2rem;
  font-weight:700;letter-spacing:-.05em;
}
.date-value{font-size:clamp(1.45rem,2.5vw,2rem)}
.section{margin-top:55px}
.section-title{
  display:flex;align-items:end;justify-content:space-between;
  gap:20px;margin-bottom:24px;
}
.section-title h2{margin:0}
.text-link{color:var(--gold);font-size:.85rem}
.text-link:hover{text-decoration:underline}
.match-list{display:grid;gap:12px}
.match{
  display:grid;grid-template-columns:45px minmax(0,1fr) auto;
  gap:22px;align-items:center;padding:22px 25px;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;
}
a.match:hover{border-color:var(--gold);background:var(--surface2)}
.match-index{font-size:1.5rem;color:var(--gold);font-family:Georgia,serif}
.match h3{font-size:1rem;margin:0 0 5px}
.match p{margin:0;color:var(--muted);font-size:.78rem}
.match-result{text-align:right}
.match-result strong{display:block;font-size:1.3rem;white-space:nowrap}
.match-result small{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:24px}
.filters label{display:flex;gap:9px;align-items:center;font-size:.83rem;color:var(--muted)}
.profile{overflow:hidden;padding:0}
.profile-photo{width:100%;height:390px;object-fit:cover}
.profile-photo.jg{object-position:50% 46%}
.profile-photo.mg{object-position:50% 37%}
.profile-body{padding:30px}
.profile-title{display:flex;justify-content:space-between;align-items:start;gap:15px}
.profile-title h2{font-size:2rem;margin-bottom:10px}
.hcp{
  border:1px solid var(--line);border-radius:10px;
  padding:9px 13px;text-align:center;min-width:76px;
}
.hcp small{display:block;color:var(--muted);font-size:.6rem;letter-spacing:.13em}
.hcp strong{font-size:1.6rem}
dl{margin:24px 0}
dl div{
  display:flex;justify-content:space-between;gap:20px;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:.85rem;
}
dt{color:var(--muted)}
dd{text-align:right;margin:0}
.honors{padding:0;list-style:none;margin:18px 0 0}
.honors li{border-top:1px solid var(--line);padding:12px 0;font-size:.86rem}
.honors li::before{content:"✦";color:var(--gold);margin-right:10px}
.timeline{display:grid;gap:20px}
.archive-card{
  display:grid;grid-template-columns:120px minmax(0,1fr) auto;
  align-items:center;gap:26px;
}
.year{font-size:3rem;font-family:Georgia,serif;color:var(--gold)}
.archive-card h3{margin-bottom:10px}
.archive-card p{margin:0;color:var(--muted);font-size:.87rem}
.archive-details{margin-top:24px}
.archive-details summary{cursor:pointer;color:var(--gold);padding:10px 0}
.notice{
  padding:18px 22px;border-left:3px solid var(--gold);
  background:var(--surface);border-radius:0 10px 10px 0;
  color:var(--muted);font-size:.88rem;margin:22px 0;
}
.notice.success{border-left-color:var(--marcel);color:var(--marcel)}
.empty{padding:50px 24px;text-align:center}
.empty h2{color:var(--gold);font-size:clamp(2rem,5vw,3rem);margin-bottom:15px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;white-space:nowrap}
td a{color:var(--gold)}
.chart{width:100%;height:auto;display:block;margin-top:22px}
.chart text{fill:var(--muted);font-size:12px}
.chart-key{display:flex;gap:22px;font-size:.8rem;margin-top:15px}
.prose{max-width:800px}
.prose p{color:var(--muted)}
.prose h2{margin-top:38px;font-size:1.8rem}
.image-placeholder{
  display:grid;place-items:center;background:#26372f;
  color:var(--gold);font-size:2rem;
}
.entry-form{max-width:850px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.form-field{display:flex;flex-direction:column;gap:8px}
.form-field.full{grid-column:1/-1}
.form-field label{color:var(--muted);font-size:.85rem}
.form-field input,.form-field select{
  width:100%;min-height:48px;padding:12px 14px;
  border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--text);color-scheme:dark;
}
.form-help{margin:0;color:var(--muted);font-size:.78rem}
.form-message{margin-top:20px}
.form-message:empty{display:none}
.form-message.error{color:#ffc0b5}
.editor-tabs{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}
footer{border-top:1px solid var(--line);padding:35px 0}
.footer-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:22px}
.footer-links{display:flex;flex-wrap:wrap;gap:22px;color:var(--muted);font-size:.8rem}
.footer-caption{color:var(--muted);font-size:.73rem;margin:20px 0 0}
@media(max-width:1000px){
  .header-row{flex-wrap:wrap;padding:20px 0;gap:16px}
  nav{order:3;width:100%;overflow-x:auto;gap:24px;padding-bottom:4px}
  nav a{white-space:nowrap}
  .hero{gap:30px}
  .grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:720px){
  .container{width:calc(100% - 32px)}
  .hero{grid-template-columns:1fr;padding:40px 0 30px;gap:30px}
  .hero h1{font-size:clamp(2.7rem,12vw,3.6rem)}
  .hero p{max-width:none}
  .trophy-image{height:230px}
  .grid.two,.grid.three,.form-grid{grid-template-columns:1fr}
  .scoreboard{padding:23px}
  .score-number{font-size:clamp(2rem,9vw,3.7rem)}
  .section{margin-top:40px}
  .page-head{padding-top:40px}
  .match{grid-template-columns:32px minmax(0,1fr);gap:12px;padding:19px}
  .match-result{text-align:left;grid-column:2}
  .section-title{align-items:start;flex-wrap:wrap}
  .archive-card{grid-template-columns:1fr;gap:14px}
  .archive-card .btn{justify-self:start}
  .profile-photo{height:350px}
  .profile-body{padding:23px}
  .stat-value{font-size:1.9rem}
  .date-value{font-size:1.55rem}
  .card{padding:22px}
  .profile{padding:0}
}
@media(max-width:380px){
  .grid.four{grid-template-columns:1fr}
  .profile-title{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>

<script>
"use strict";

/*
  Dateien:
  index.html, JG.jpg, MG.jpg, pokal.jpg

  JPG unterstützt keine Transparenz.
  Für PNG/WebP den Dateinamen unter trophyImage ändern.

  Bearbeitungen gelten zunächst nur in diesem geöffneten Tab.
  Danach HTML herunterladen und auf GitHub veröffentlichen.
*/
const CONFIG = {
  currentSeason: 2026,
  trophyImage: "pokal.jpg",
  nextEvent: {
    date: "2026-10-31",
    club: "Golfclub Erftaue",
    time: null
  }
};

const SEASONS = {
  2024:{format:"Historische Saison",completed:true,champion:"Marcel Glatter"},
  2025:{format:"Bruttoschläge",completed:true,champion:"Marcel Glatter"},
  2026:{format:"Lochspiel ohne Vorgabe",completed:false,champion:null}
};

const DATA = JSON.parse(
  document.getElementById("results-data").textContent
);

const PLAYERS = [
  {
    name:"Julian Glatter",short:"Julian",key:"jg",color:"julian",
    birth:"18. Februar 1992",handicap:"9,6",
    club:"Golfclub Duvenhof · seit 2023",
    otherClub:"Golfclub Erftaue · bis 2023",
    otherLabel:"Vorheriger Club",
    text:"Julian spielt seit 2004 Golf. Nach vielen Jahren im Golfclub Erftaue wechselte er 2023 zum Golfclub Duvenhof. Fünf Titel auf der Barden Tour gehören zu seinen bisherigen Karriereerfolgen.",
    titles:["5-facher Barden Tour Champion"]
  },
  {
    name:"Marcel Glatter",short:"Marcel",key:"mg",color:"marcel",
    birth:"27. September 1993",handicap:"5,7",
    club:"Golfclub Erftaue · bis einschließlich 2026",
    otherClub:"Golfclub Duvenhof · ab Saison 2027",
    otherLabel:"Clubwechsel",
    text:"Marcel spielt seit 2004 Golf und bis einschließlich 2026 im Golfclub Erftaue. Ab der Saison 2027 wechselt er zum Golfclub Duvenhof. Mit den Titeln 2024 und 2025 ist er der Titelverteidiger der Brotherhood Open 2026.",
    titles:[
      "Jugendclubmeister GC Erftaue 2010 und 2011",
      "Hacker Tour Champion 2024",
      "AK30 Clubmeister GC Erftaue 2025",
      "Brotherhood Open Champion 2024 und 2025",
      "3-facher Barden Tour Champion"
    ]
  }
];

const main=document.getElementById("content");
let activeSeason=CONFIG.currentSeason;
let changes=0;
let needsDownload=false;
let flashMessage="";
let undoSnapshot=null;

function esc(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function number(value,digits=0){
  return new Intl.NumberFormat("de-DE",{
    minimumFractionDigits:digits,maximumFractionDigits:digits
  }).format(value);
}
function date(value){
  return new Intl.DateTimeFormat("de-DE",{
    day:"2-digit",month:"2-digit",year:"numeric"
  }).format(new Date(value+"T12:00:00"));
}
function longDate(value){
  return new Intl.DateTimeFormat("de-DE",{
    weekday:"long",day:"numeric",month:"long",year:"numeric"
  }).format(new Date(value+"T12:00:00"));
}
function matches(year){
  return (DATA[year]||[]).map((r,i)=>({
    year,id:i+1,date:r[0],club:r[1],j:r[2],m:r[3],session:r[4]||""
  }));
}
function winner(r){
  if(r.j===r.m)return "draw";
  return r.year===2026?(r.j>r.m?"j":"m"):(r.j<r.m?"j":"m");
}
function summary(list){
  const s={j:0,m:0,jWins:0,mWins:0,draw:0};
  list.forEach(r=>{
    s.j+=r.j;s.m+=r.m;
    const w=winner(r);
    if(w==="draw")s.draw++;else s[w+"Wins"]++;
  });
  return s;
}
function unit(year){return year===2026?"Lochvorsprünge":"Schläge"}
function dailyUnit(year){
  return year===2026?"Lochvorsprung des Spieltags":"Bruttoschläge des Spieltags";
}
function resultText(r){
  const w=winner(r);
  if(w==="draw")return "Unentschieden";
  const margin=Math.abs(r.j-r.m);
  const label=r.year===2026
    ?(margin===1?"Loch":"Löchern"):(margin===1?"Schlag":"Schlägen");
  return `${w==="j"?"Julian":"Marcel"} gewinnt mit ${margin} ${label} Vorsprung`;
}
function head(kicker,title,description=""){
  return `<div class="page-head">
    <span class="eyebrow">${kicker}</span><h1>${title}</h1>

function scoreboard(year){
  const list=matches(year);
  if(!list.length)return emptySeason(year);
  const s=summary(list),completed=SEASONS[year].completed;
  const margin=Math.abs(s.j-s.m);
  const leader=s.j===s.m?null:
    ((year===2026?s.j>s.m:s.j<s.m)?"Julian":"Marcel");
  const label=year===2026
    ?(margin===1?"Loch":"Löchern"):(margin===1?"Schlag":"Schlägen");

  return `<div class="scoreboard">
    <div class="score-top">
      <span class="eyebrow" style="margin:0">Saison ${year}</span>
      <span class="pill">${completed?"Endergebnis":"Aktueller Stand"}</span>
    </div>
    <div class="duel">
      ${scorePlayer(PLAYERS[0],s.j)}<span class="vs">vs.</span>
      ${scorePlayer(PLAYERS[1],s.m)}
    </div>
    <div class="score-note">
      <p>${leader
        ?`${leader} ${completed?"gewinnt":"führt"} mit ${number(margin)} ${label} Vorsprung.`
        :"Gleichstand in der Gesamtwertung."}</p>
      <p class="muted">
        ${year===2026?"Kumulierte Lochvorsprünge":"Gesamte Bruttoschläge"}
        · ${list.length} Spieltage
      </p>
    </div>
  </div>`;
}

function cumulativeRows(year){
  let j=0,m=0;
  return matches(year).map(r=>({...r,cj:j+=r.j,cm:m+=r.m}));
}
function chart(year){
  const rows=cumulativeRows(year);
  const max=Math.max(1,...rows.flatMap(r=>[r.cj,r.cm]));
  const x=i=>45+i*610/Math.max(1,rows.length);
  const y=v=>205-v/max*165;
  const points=key=>[`${x(0)},${y(0)}`,
    ...rows.map((r,i)=>`${x(i+1)},${y(r[key])}`)].join(" ");
  const interval=Math.max(1,Math.ceil(rows.length/16));
  return `<svg class="chart" viewBox="0 0 700 250" role="img"
    aria-label="Kumulierte Saisonwerte. Genaue Werte stehen in der folgenden Tabelle.">
    <line x1="45" y1="205" x2="665" y2="205" stroke="#536158"/>
    <line x1="45" y1="40" x2="665" y2="40" stroke="#35443d" stroke-dasharray="4 6"/>
    <text x="45" y="26">${number(max)} ${unit(year)}</text>
    <polyline points="${points("cj")}" fill="none" stroke="#a7caff" stroke-width="3"/>
    <polyline points="${points("cm")}" fill="none" stroke="#9bddbd"
      stroke-width="3" stroke-dasharray="7 4"/>
    ${rows.map((r,i)=>(i%interval===0||i===rows.length-1)
      ?`<text x="${x(i+1)}" y="228" text-anchor="middle">${r.id}</text>`:"").join("")}
    <text x="350" y="248" text-anchor="middle">Spieltag</text>
  </svg>
  <div class="chart-key"><span class="julian">━━ Julian</span>
    <span class="marcel">┄┄ Marcel</span></div>`;
}

function longestStreak(list,key){
  let best=0,current=0,previousYear=null;
  list.forEach(r=>{
    if(previousYear!==r.year)current=0;
    current=winner(r)===key?current+1:0;
    best=Math.max(best,current);previousYear=r.year;
  });
  return best;
}
function recordCard(year,key){
  const list=matches(year);
  if(!list.length)return "";
  const p=PLAYERS[key==="j"?0:1];
  const best=year===2026
    ?Math.max(...list.map(r=>r[key])):Math.min(...list.map(r=>r[key]));
  return `<div class="card">
    <span class="eyebrow">${p.short} · ${year}</span>
    <h3>${year===2026?"Größter dokumentierter Lochspielvorsprung":"Niedrigstes dokumentiertes Ergebnis"}</h3>
    <strong class="stat-value ${p.color}">${best}
      <span style="font-size:1rem;letter-spacing:0">
        ${year===2026?"Löcher Vorsprung":"Schläge"}
      </span>
    </strong>
    ${list.filter(r=>r[key]===best).map(r=>`
      <p style="margin:13px 0 0;font-size:.82rem">
        <a class="text-link" href="#spieltag/${year}/${r.id}">

}
function statistics(year,all=false){

  const s=summary(list),years=all?[2025,2026]:[year];

    "Bestleistungen werden innerhalb ihres jeweiligen Wertungsformats verglichen.")+`

  if(!list.length)return html+emptySeason(year);
  html+=`${all?`<p class="notice">${list.length} dokumentierte Spieltage
    aus 2025 und 2026. Für 2024 fehlen Einzelergebnisse.
    Siegesserien werden je Saison ermittelt.</p>`:""}
    <div class="grid four">
      ${metric("Julian · Spieltagssiege",s.jWins,"Dokumentierte Ergebnisse","julian")}
      ${metric("Marcel · Spieltagssiege",s.mWins,"Dokumentierte Ergebnisse","marcel")}
      ${metric("Unentschieden",s.draw,"Dokumentierte Ergebnisse")}
      ${metric("Längste Siegesserie",
        `${longestStreak(list,"j")} / ${longestStreak(list,"m")}`,"Julian / Marcel")}
    </div>`;
  years.forEach(y=>{
    const rows=matches(y),totals=summary(rows);
    html+=`<section class="section">
      <div class="section-title"><h2>${y} · ${y===2026?"Lochspiel":"Bruttoschläge"}</h2></div>
      <div class="grid two">${recordCard(y,"j")}${recordCard(y,"m")}</div>
      ${y===2025?`<div class="grid two" style="margin-top:20px">
        ${metric("Julian · Durchschnitt",number(totals.j/rows.length,2),
          "Schläge je eingetragenem Spieltag","julian")}
        ${metric("Marcel · Durchschnitt",number(totals.m/rows.length,2),
          "Schläge je eingetragenem Spieltag","marcel")}
      </div><p class="caption" style="margin-top:14px">
        Kein normalisierter 18-Loch-Schnitt: Grundlage sind die eingetragenen Ergebnisse.
      </p>`:""}
    </section>`;
  });
  return html;
}

      ?"Aktualisierten Download erstellen und auf GitHub hochladen."
      :"Download angefordert. Veröffentlichung auf GitHub noch erforderlich."}
    <a class="text-link" href="#bearbeiten/${activeSeason===2024?2026:activeSeason}">
      Zur Verwaltung →
    </a>
  </div>`;
}
function publicationPanel(){
  return `<section class="section card entry-form">
    <span class="eyebrow">Dauerhaft veröffentlichen</span>
    <h2 style="font-size:1.8rem">Website herunterladen.</h2>
    <p class="muted">Der Download enthält alle Ergänzungen und Korrekturen.
      Ersetze damit auf GitHub die bisherige index.html.
      Der öffentliche Link bleibt gleich.</p>
    <p id="export-status" class="caption" role="status">
      Änderungen dieser Sitzung: ${changes}.
      ${needsDownload?"Aktualisierter Download erforderlich.":""}
    </p>
    <div class="actions">
      <button class="btn primary" id="download-website" type="button">
        Aktualisierte Website herunterladen ↓
      </button>
      <button class="btn" id="undo-change" type="button"
        ${undoSnapshot?"":"disabled"}>
        Letzte Änderung rückgängig
      </button>
    </div>
    <p class="caption" style="margin-top:16px">
      Falls der Browser „index (1).html“ speichert, vor dem Upload in
      „index.html“ umbenennen. Bilder bleiben separate Dateien.
    </p>
  </section>`;
}
function editorPage(edit=false,year=2026,id=0){
  const list=matches(year);
  const r=edit&&id?list.find(item=>item.id===id):null;
  if(edit&&id&&!r)return notFound();

  const clubs=availableClubs();
  const heading=head(
    "Turnierpflege",
    edit?"Ergebnisse korrigieren.":"Das nächste Duell festhalten.",
    "Gespeicherte Änderungen aktualisieren sofort alle Berechnungen in dieser geöffneten Website."
  );

  const selector=edit?`
    <div class="card entry-form" style="margin-bottom:24px">
      <div class="form-grid">
        <div class="form-field">
          <label for="edit-season">Saison</label>
          <select id="edit-season">
            <option value="2026" ${year===2026?"selected":""}>2026</option>
            <option value="2025" ${year===2025?"selected":""}>2025</option>
          </select>
        </div>
        <div class="form-field">
          <label for="edit-match">Spieltag auswählen</label>
          <select id="edit-match">
            <option value="">Bitte auswählen</option>
            ${list.map(item=>`
              <option value="${item.id}" ${item.id===id?"selected":""}>
                ${item.id}. Spieltag · ${date(item.date)} · ${esc(item.club)}
                ${item.session?" · "+esc(item.session):""}
                · ${item.j} : ${item.m}
              </option>`).join("")}
          </select>
        </div>
      </div>
    </div>`:"";

  const form=(!edit||r)?`
    <div class="card entry-form">
      <h2 style="font-size:1.7rem">
        ${edit?`Spieltag ${id} · Saison ${year}`:"Neuer Spieltag"}
      </h2>
      <form id="match-form" data-mode="${edit?"edit":"add"}"
        data-year="${year}" data-id="${id}">
        <div class="form-grid">
          <div class="form-field">
            <label for="match-date">Datum</label>
            <input id="match-date" name="date" type="date" required
              min="${edit?year:2025}-01-01"
              max="${edit?year:2026}-12-31"
              value="${r?esc(r.date):""}">
          </div>
          <div class="form-field">
            <label for="match-club">Golfclub</label>
            <select id="match-club" name="club" required>
              <option value="">Bitte auswählen</option>
              ${clubs.map(club=>`
                <option value="${esc(club)}" ${r&&r.club===club?"selected":""}>
                  ${esc(club)}
                </option>`).join("")}
            </select>
          </div>
          <div class="form-field">
            <label for="match-julian">Ergebnis Julian</label>
            <input id="match-julian" name="julian" type="number"
              min="0" step="1" inputmode="numeric" required
              value="${r?r.j:""}">
          </div>
          <div class="form-field">
            <label for="match-marcel">Ergebnis Marcel</label>
            <input id="match-marcel" name="marcel" type="number"
              min="0" step="1" inputmode="numeric" required
              value="${r?r.m:""}">
          </div>
          <div class="form-field full">
            <label for="match-session">Rundenbezeichnung (optional)</label>
            <input id="match-session" name="session" type="text"
              maxlength="100" placeholder="Zum Beispiel: Nachmittag · 18 Loch"
              value="${r?esc(r.session):""}">
            <p class="form-help">Hilfreich bei mehreren Runden am selben Tag.</p>
          </div>
          <div class="form-field full">
            <p id="format-help" class="form-help"></p>
            <p class="form-help">
              Die Spieltagsnummer bleibt beim Bearbeiten erhalten.
              Datumsänderungen müssen die Reihenfolge der Spieltage beibehalten.
            </p>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" type="submit">
            ${edit?"Änderungen speichern":"Spieltag hinzufügen"} →
          </button>
          ${r?`<a class="btn" href="#spieltag/${year}/${id}">
            Zur Detailansicht
          </a>`:""}
        </div>
        <div id="form-message" class="form-message error"
          role="alert" aria-live="polite"></div>
      </form>
    </div>`:`<p class="notice">Wähle oben den Spieltag aus, den du ändern möchtest.</p>`;

  return heading+`
    <div class="editor-tabs">
      <a class="btn ${!edit?"primary":""}" href="#hinzufuegen">Neuer Spieltag</a>
      <a class="btn ${edit?"primary":""}" href="#bearbeiten/${year}">
        Bestehende Spieltage
      </a>
    </div>
    <p class="notice">
      <strong>GitHub Pages:</strong> „Speichern“ aktualisiert sofort diese
      geöffnete Ansicht. Für alle Besucher werden Änderungen erst nach
      Download und Upload der index.html sichtbar.
      Beim Neuladen gehen noch nicht exportierte Änderungen verloren.
      Dies ist keine geschützte Serververwaltung.
    </p>
    ${selector}${form}
    <section class="section entry-form">
      <div class="section-title"><h2>Aktueller Stand ${year}</h2></div>
      ${scoreboard(year)}
    </section>
    ${publicationPanel()}`;
}
function formHelp(year){
  return year===2026
    ?"2026 · Lochspiel: Julian gewinnt mit 3 Löchern → 3 : 0. Marcel gewinnt mit 3 Löchern → 0 : 3. Unentschieden → 0 : 0."
    :year===2025
      ?"2025 · Bruttoschläge beider Spieler eintragen. Niedrigere Werte sind besser."
      :"Die Saison ergibt sich aus dem Datum. Eingerichtet sind 2025 und 2026.";
}
function saveSnapshot(){
  undoSnapshot=JSON.stringify(DATA);
}
function goTo(hash){
  if(location.hash===hash){
    render();
    main.focus({preventScroll:true});
  }else{
    location.hash=hash;
  }
}
function bindEditor(){
  const seasonSelect=document.getElementById("edit-season");
  const matchSelect=document.getElementById("edit-match");

  if(seasonSelect){
    seasonSelect.addEventListener("change",()=>{
      location.hash=`bearbeiten/${seasonSelect.value}`;
    });
  }
  if(matchSelect){
    matchSelect.addEventListener("change",()=>{
      location.hash=`bearbeiten/${seasonSelect.value}${
        matchSelect.value?"/"+matchSelect.value:""}`;
    });
  }

  const form=document.getElementById("match-form");
  if(form){
    const edit=form.dataset.mode==="edit";
    const originalYear=Number(form.dataset.year);
    const id=Number(form.dataset.id);
    const input=document.getElementById("match-date");
    const help=document.getElementById("format-help");
    const message=document.getElementById("form-message");
    const updateHelp=()=>help.textContent=formHelp(Number(input.value.slice(0,4)));
    updateHelp();
    input.addEventListener("change",updateHelp);

    form.addEventListener("submit",event=>{
      event.preventDefault();
      if(!form.reportValidity())return;
      const values=new FormData(form);
      const playedDate=String(values.get("date"));
      const club=String(values.get("club"));
      const j=Number(values.get("julian"));
      const m=Number(values.get("marcel"));
      const session=String(values.get("session")||"").trim();
      const year=Number(playedDate.slice(0,4));
      const fail=text=>{message.textContent=text;};
      message.textContent="";

      if(![2025,2026].includes(year)){
        fail("Bitte ein Datum aus 2025 oder 2026 wählen.");return;
      }
      if(edit&&year!==originalYear){
        fail("Die Saison eines bestehenden Spieltags kann hier nicht gewechselt werden.");return;
      }
      if(!availableClubs().includes(club)){
        fail("Bitte einen Golfclub aus der Liste wählen.");return;
      }
      if(!Number.isSafeInteger(j)||!Number.isSafeInteger(m)||j<0||m<0){
        fail("Bitte nicht negative ganze Zahlen eingeben.");return;
      }
      if(year===2025&&(j===0||m===0)){
        fail("Bruttoschläge müssen für beide Spieler größer als null sein.");return;
      }
      if(year===2026&&j>0&&m>0){
        fail("Beim Lochspiel nur den Vorsprung des Siegers eintragen: z. B. 3 : 0, 0 : 3 oder 0 : 0.");return;
      }

      const index=edit?id-1:DATA[year].length;
      const old=edit?DATA[year][index]:null;
      if(edit&&!old){fail("Der ausgewählte Spieltag existiert nicht.");return;}

      const previous=DATA[year][index-1];
      const next=edit?DATA[year][index+1]:null;
      if(previous&&playedDate<previous[0]){
        fail("Das Datum darf nicht vor dem vorherigen Spieltag ("+
          date(previous[0])+") liegen. Die Spieltagsnummern bleiben unverändert.");
        return;
      }
      if(next&&playedDate>next[0]){
        fail("Das Datum darf nicht nach dem folgenden Spieltag ("+
          date(next[0])+") liegen. Die Spieltagsnummern bleiben unverändert.");
        return;
      }

      const row=[playedDate,club,j,m];
      if(session)row.push(session);

      if(edit&&JSON.stringify(old)===JSON.stringify(row)){
        fail("Es wurden keine Änderungen vorgenommen.");return;
      }

      const duplicate=DATA[year].some((r,i)=>
        i!==index&&r[0]===playedDate&&r[1]===club&&r[2]===j&&r[3]===m
      );
      if(duplicate&&!window.confirm(
        "Ein anderer Spieltag hat dasselbe Datum, denselben Club und dasselbe Ergebnis. Sind dies tatsächlich getrennte Runden?"
      ))return;

      /*
        Historische Titel sind bestätigt.
        Korrekturen dürfen ihnen nicht unbemerkt widersprechen.
      */
      if(SEASONS[year].completed){
        const s=summary(matches(year));
        const totalJ=s.j-(old?old[2]:0)+j;
        const totalM=s.m-(old?old[3]:0)+m;
        const calculated=totalJ<totalM?"Julian Glatter":
          totalM<totalJ?"Marcel Glatter":null;
        if(calculated!==SEASONS[year].champion){
          fail("Diese Änderung widerspricht dem bestätigten Saisonsieger oder erzeugt einen Gleichstand. Bitte historische Ergebnisse und Sieger zuerst gemeinsam prüfen.");
          return;
        }
        if(!window.confirm(
          "Die Saison ist bereits abgeschlossen. Möchtest du diese Korrektur wirklich übernehmen?"
        ))return;
      }

      saveSnapshot();
      if(edit)DATA[year][index]=row;
      else DATA[year].push(row);
      changes++;
      needsDownload=true;
      activeSeason=year;
      flashMessage=`Spieltag ${index+1} (${year}) ${
        edit?"aktualisiert":"hinzugefügt"}.
        Gesamtstand, Statistiken und Rekorde wurden neu berechnet.
        Bitte die Website herunterladen und auf GitHub veröffentlichen.`;

      goTo(`#bearbeiten/${year}/${index+1}`);
    });
  }

  const download=document.getElementById("download-website");
  if(download)download.addEventListener("click",downloadUpdatedWebsite);

  const undo=document.getElementById("undo-change");
  if(undo)undo.addEventListener("click",()=>{
    if(!undoSnapshot)return;
    if(!window.confirm("Die zuletzt gespeicherte Änderung rückgängig machen?"))return;
    const previous=JSON.parse(undoSnapshot);
    Object.keys(DATA).forEach(key=>delete DATA[key]);
    Object.assign(DATA,previous);
    undoSnapshot=null;
    changes++;
    needsDownload=true;
    flashMessage="Letzte Änderung rückgängig gemacht. Alle Werte wurden neu berechnet. Bitte bei Bedarf erneut exportieren.";
    goTo(`#bearbeiten/${activeSeason===2024?2026:activeSeason}`);
  });
}

function downloadUpdatedWebsite(){
  const clone=document.documentElement.cloneNode(true);
  const dataBlock=clone.querySelector("#results-data");
  if(!dataBlock){
    window.alert("Datenblock fehlt. Export nicht möglich.");return;
  }
  dataBlock.textContent="\n"+JSON.stringify(DATA,null,2)
    .replace(/</g,"\\u003c")
    .replace(/\u2028/g,"\\u2028")
    .replace(/\u2029/g,"\\u2029")+"\n";

  clone.querySelector("#content").innerHTML="";
  clone.querySelector("#navigation").innerHTML="";
  clone.querySelector("title").textContent=
    "Brotherhood Open — Zwei Brüder. Ein Titel.";

  const blob=new Blob(["<!DOCTYPE html>\n"+clone.outerHTML],{
    type:"text/html;charset=utf-8"
  });
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;link.download="index.html";
  document.body.appendChild(link);link.click();link.remove();
  window.setTimeout(()=>URL.revokeObjectURL(url),10000);
  needsDownload=false;

  const status=document.getElementById("export-status");
  if(status)status.textContent=
    "Download angefordert. Prüfe die Datei im Download-Ordner und ersetze auf GitHub die bisherige index.html. Die Website kann den Upload nicht selbst prüfen.";
}

function notFound(){
  return head("Seite nicht gefunden","Hier liegt kein Ball.")+`
    <p class="muted">Diese Seite oder dieser Spieltag ist nicht vorhanden.</p>
    <a class="btn primary" href="#start/${CONFIG.currentSeason}">Zur Startseite</a>`;
}
function installImageFallbacks(){
  main.querySelectorAll("img.avatar,img.profile-photo").forEach(image=>{
    const replace=()=>{
      if(!image.isConnected)return;
      const box=document.createElement("div");
      box.className=image.className+" image-placeholder";
      box.textContent=image.classList.contains("jg")?"JG":"MG";
      box.setAttribute("role","img");
      box.setAttribute("aria-label",image.alt+" – Bild fehlt");
      image.replaceWith(box);
    };
    image.addEventListener("error",replace,{once:true});
    if(image.complete&&image.naturalWidth===0)replace();
  });
  const trophy=main.querySelector(".trophy-image");
  if(trophy){
    const replace=()=>{
      if(!trophy.isConnected)return;
      const box=document.createElement("div");
      box.className="trophy-placeholder";
      box.textContent="Pokalbild fehlt. Bitte "+CONFIG.trophyImage+
        " im gleichen Ordner wie index.html speichern.";
      trophy.replaceWith(box);
    };
    trophy.addEventListener("error",replace,{once:true});
    if(trophy.complete&&trophy.naturalWidth===0)replace();
  }
}

function render(){
  const raw=location.hash.slice(1);
  const parts=(raw==="content"?"":raw).split("/");
  const page=parts[0]||"start";
  const requested=Number(parts[1]);
  const known=Object.prototype.hasOwnProperty.call(SEASONS,requested);
  let year=known?requested:activeSeason;
  if(page==="bearbeiten"&&!parts[1]&&year===2024)year=2026;
  const seasonal=["start","saison","spieltage","statistiken","spieltag","bearbeiten"];
  const invalidYear=seasonal.includes(page)&&Boolean(parts[1])&&!known;
  activeSeason=year;

  document.getElementById("season").value=String(year);
  document.querySelectorAll("[data-home]").forEach(link=>{
    link.href=`#start/${CONFIG.currentSeason}`;
  });
  const navigation=[
    ["start","Übersicht"],["saison","Saison"],["spieltage","Spieltage"],
    ["statistiken","Statistiken"],["historie","Historie"],["spieler","Spieler"]
  ];
  document.getElementById("navigation").innerHTML=navigation.map(([key,label])=>{
    const selected=page===key||
      (["spieltag","bearbeiten","hinzufuegen"].includes(page)&&key==="spieltage");
    return `<a href="#${key}${seasonal.includes(key)?"/"+year:""}"
      ${selected?'aria-current="page"':""}>${label}</a>`;
  }).join("");

  const views={
    start:()=>start(year),
    saison:()=>seasonPage(year),
    spieltage:()=>matchDays(year),
    spieltag:()=>matchDetail(year,Number(parts[2])),
    statistiken:()=>statistics(year,parts[2]==="alle"),
    historie:historyPage,
    spieler:profiles,
    regeln:rulesPage,
    termine:datesPage,
    ueber:aboutPage,
    hinzufuegen:()=>editorPage(false,year===2024?2026:year),
    bearbeiten:()=>year===2024
      ?head("Spieltage bearbeiten","Keine Einzelergebnisse vorhanden.")+
        `<p class="notice">Für 2024 sind keine Spieltage hinterlegt.</p>
         <a class="btn" href="#bearbeiten/2026">Saison 2026 bearbeiten</a>`
      :editorPage(true,year,Number(parts[2])||0)
  };

  const flash=flashMessage;
  flashMessage="";
  main.innerHTML=draftNotice()+
    (flash?`<div class="notice success" role="status">${esc(flash)}</div>`:"")+
    (invalidYear?notFound():(views[page]||notFound)());

  const titles={
    start:"Zwei Brüder. Ein Titel.",saison:`Saison ${year}`,
    spieltage:`Spieltage ${year}`,
    spieltag:`Spieltag ${Number(parts[2])||""} · ${year}`,
    statistiken:"Statistiken",historie:"Siegerarchiv",spieler:"Die Spieler",
    regeln:"Regeln & Format",termine:"Termine",ueber:"Über das Turnier",
    hinzufuegen:"Spieltag hinzufügen",bearbeiten:"Spieltage bearbeiten"
  };
  document.title=(invalidYear?"Seite nicht gefunden":
    titles[page]||"Seite nicht gefunden")+" — Brotherhood Open";

  if(!invalidYear&&page==="spieltage"&&matches(year).length){
    filterMatches(year);
    document.getElementById("winner-filter")
      .addEventListener("change",()=>filterMatches(year));
    document.getElementById("sort-filter")
      .addEventListener("change",()=>filterMatches(year));
  }
  const scope=document.getElementById("stats-scope");
  if(scope)scope.addEventListener("change",event=>{
    location.hash=`statistiken/${year}${event.target.value==="all"?"/alle":""}`;
  });
  installImageFallbacks();
  bindEditor();
}

document.getElementById("season").addEventListener("change",event=>{
  const year=Number(event.target.value);
  const parts=location.hash.slice(1).split("/");
  const page=parts[0]||"start";
  const target=["start","saison","spieltage","statistiken","bearbeiten"].includes(page)
    ?page:"saison";
  const scope=target==="statistiken"&&parts[2]==="alle"?"/alle":"";
  location.hash=`${target}/${year}${scope}`;
});
document.querySelector(".skip").addEventListener("click",event=>{
  event.preventDefault();main.focus();main.scrollIntoView({block:"start"});
});
window.addEventListener("hashchange",()=>{
  render();window.scrollTo(0,0);main.focus({preventScroll:true});
});
window.addEventListener("beforeunload",event=>{
  if(needsDownload){event.preventDefault();event.returnValue="";}
});

render();
</script>
</body>
</html>
