<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101817">
<meta name="description" content="Brotherhood Open: Das jährliche Golfduell zwischen Julian und Marcel Glatter. Ergebnisse, Spieltage und Historie seit 2024.">
<title>Brotherhood Open — Zwei Brüder. Ein Titel.</title>

<style>
:root {
  --bg:#101817;
  --surface:#182321;
  --surface2:#202e2a;
  --line:#35443d;
  --text:#f2f0e8;
  --muted:#b2beb5;
  --gold:#e1c18a;
  --julian:#a7caff;
  --marcel:#9bddbd;
  --radius:20px;
}
* { box-sizing:border-box }
html { scroll-behavior:smooth }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.6;
}
a { color:inherit; text-decoration:none }
button,select { font:inherit; cursor:pointer }
button,a,select { -webkit-tap-highlight-color:transparent }
a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible {
  outline:3px solid var(--gold);
  outline-offset:5px;
}
img { display:block; max-width:100% }
h1,h2,h3,p { margin-top:0 }
h1,h2,h3 { line-height:1.12 }
h1 {
  font-size:clamp(2.8rem,6.8vw,6rem);
  letter-spacing:-.065em;
  margin-bottom:24px;
}
h2 { font-size:clamp(1.8rem,3.5vw,3rem); letter-spacing:-.045em }
h3 { font-size:1.2rem; letter-spacing:-.025em }
small { font-size:.8rem }
.container { width:min(1180px,calc(100% - 48px)); margin:auto }
.muted { color:var(--muted) }
.gold { color:var(--gold) }
.julian { color:var(--julian) }
.marcel { color:var(--marcel) }
.eyebrow {
  display:block;
  margin-bottom:20px;
  color:var(--gold);
  text-transform:uppercase;
  letter-spacing:.2em;
  font-size:.72rem;
  font-weight:750;
}
.caption { color:var(--muted); font-size:.8rem }
.skip {
  position:absolute;
  left:16px;
  top:-100px;
  z-index:20;
  padding:12px;
  background:var(--gold);
  color:var(--bg);
}
.skip:focus { top:12px }
header {
  border-bottom:1px solid var(--line);
  background:rgba(16,24,23,.97);
}
.header-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:88px;
  gap:24px;
}
.brand { display:flex; align-items:center; gap:13px }
.monogram {
  display:grid;
  place-items:center;
  width:43px;
  height:43px;
  flex-shrink:0;
  border:1px solid var(--gold);
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:23px;
}
.wordmark {
  line-height:1.1;
  font-size:.8rem;
  font-weight:800;
  letter-spacing:.13em;
}
.wordmark small {
  display:block;
  margin-top:7px;
  color:var(--muted);
  font-size:.59rem;
  letter-spacing:.25em;
  font-weight:500;
}
nav { display:flex; gap:23px; align-items:center }
nav a {
  padding:12px 0;
  color:var(--muted);
  font-size:.82rem;
}
nav a:hover,nav a[aria-current="page"] { color:var(--gold) }
select {
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--surface);
  color:var(--text);
}
.season-label { color:var(--muted); font-size:.73rem; margin-right:7px }
main { min-height:70vh; padding-bottom:70px }
main:focus { outline:none }
.page-head { padding:64px 0 32px }
.page-head p { max-width:650px; color:var(--muted) }
.page-head h1 { font-size:clamp(2.6rem,5vw,4.6rem) }
.hero {
  display:grid;
  grid-template-columns:1.1fr 1fr;
  gap:60px;
  align-items:center;
  padding:60px 0 65px;
}
.hero p { color:var(--muted); max-width:460px }
.hero-title em {
  color:var(--gold);
  font-family:Georgia,serif;
  font-weight:400;
}
.actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px }
.btn {
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:13px 20px;
  border-radius:8px;
  border:1px solid var(--line);
  background:transparent;
  font-size:.85rem;
  font-weight:650;
  transition:transform .2s,background .2s;
}
.btn:hover { background:var(--surface2); transform:translateY(-2px) }
.btn.primary { background:var(--gold); color:#17211d; border-color:var(--gold) }
.btn.primary:hover { background:#efd4a8 }

/* Freigestellter Pokal */
.hero-right {
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:24px;
  min-width:0;
}
.hero-trophy {
  position:relative;
  isolation:isolate;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:0;
  padding:12px 20px 0;
}
.hero-trophy::before {
  content:"";
  position:absolute;
  z-index:-1;
  width:min(100%,340px);
  height:280px;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(
    ellipse,
    rgba(225,193,138,.17) 0%,
    rgba(225,193,138,.05) 45%,
    transparent 72%
  );
  pointer-events:none;
}
.trophy-image {
  display:block;
  width:auto;
  height:290px;
  max-width:100%;
  object-fit:contain;
  filter:drop-shadow(0 16px 20px rgba(0,0,0,.4));
}
.hero-trophy figcaption {
  margin-top:18px;
  color:var(--gold);
  font-size:.65rem;
  font-weight:650;
  letter-spacing:.24em;
  text-align:center;
}
.image-placeholder {
  display:grid;
  place-items:center;
  background:#26372f;
  color:var(--gold);
  font-size:2rem;
  text-align:center;
}
.trophy-placeholder {
  max-width:280px;
  padding:24px;
  border:1px dashed var(--line);
  border-radius:12px;
  font-size:.8rem;
  color:var(--muted);
  text-align:center;
}

/* Ergebnisanzeige */
.scoreboard {
  position:relative;
  overflow:hidden;
  padding:30px;
  border:1px solid #596047;
  border-radius:var(--radius);
  background:linear-gradient(145deg,#24372e,#17231f);
}
.scoreboard::before {
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  right:-170px;
  top:-100px;
  border:1px solid rgba(225,193,138,.1);
  border-radius:50%;
  pointer-events:none;
}
.score-top {
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
}
.pill {
  display:inline-block;
  padding:6px 10px;
  border-radius:30px;
  background:rgba(225,193,138,.1);
  color:var(--gold);
  font-size:.67rem;
  font-weight:750;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.duel {
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  text-align:center;
  gap:12px;
  margin:28px 0;
}
.avatar {
  width:77px;
  height:77px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--line);
  margin:0 auto 12px;
}
.avatar.jg { object-position:50% 48%; border-color:var(--julian) }
.avatar.mg { object-position:65% 39%; border-color:var(--marcel) }
.duel-name { font-size:.88rem; font-weight:650 }
.duel-name small { display:block; color:var(--muted); font-weight:400 }
.score-number {
  margin-top:10px;
  font-size:clamp(2.7rem,4.7vw,4.8rem);
  line-height:1.15;
  font-weight:750;
  letter-spacing:-.07em;
  font-variant-numeric:tabular-nums;
}
.vs { color:var(--muted); font-family:Georgia,serif; font-style:italic }
.score-note {
  text-align:center;
  border-top:1px solid var(--line);
  padding-top:20px;
}
.score-note p { margin:0 auto; font-size:.83rem }
.score-note p + p { margin-top:8px }

/* Karten und Listen */
.grid { display:grid; gap:20px }
.grid.two { grid-template-columns:repeat(2,minmax(0,1fr)) }
.grid.three { grid-template-columns:repeat(3,minmax(0,1fr)) }
.grid.four { grid-template-columns:repeat(4,minmax(0,1fr)) }
.card {
  min-width:0;
  padding:26px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
}
.card p:last-child { margin-bottom:0 }
.stat-label { display:block; color:var(--muted); font-size:.78rem }
.stat-value {
  display:block;
  margin:8px 0 3px;
  font-size:2.2rem;
  font-weight:700;
  letter-spacing:-.05em;
}
.section { margin-top:65px }
.section-title {
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:24px;
}
.section-title h2 { margin:0 }
.text-link { color:var(--gold); font-size:.85rem }
.text-link:hover { text-decoration:underline }
.match-list { display:grid; gap:12px }
.match {
  display:grid;
  grid-template-columns:54px minmax(0,1fr) auto;
  gap:22px;
  align-items:center;
  padding:22px 25px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:13px;
}
a.match:hover { border-color:var(--gold); background:var(--surface2) }
.match-index { font-size:1.5rem; color:var(--gold); font-family:Georgia,serif }
.match h3 { font-size:1rem; margin:0 0 5px }
.match p { margin:0; color:var(--muted); font-size:.78rem }
.match-result { text-align:right }
.match-result strong { display:block; font-size:1.3rem; white-space:nowrap }
.match-result small { color:var(--muted) }
.filters { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:24px }
.filters label {
  display:flex;
  gap:9px;
  align-items:center;
  font-size:.83rem;
  color:var(--muted);
}

/* Spielerprofile */
.profile { overflow:hidden; padding:0 }
.profile-photo { width:100%; height:390px; object-fit:cover }
.profile-photo.jg { object-position:50% 46% }
.profile-photo.mg { object-position:50% 37% }
.profile-body { padding:30px }
.profile-title {
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:15px;
}
.profile-title h2 { font-size:2rem; margin-bottom:10px }
.hcp {
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 13px;
  text-align:center;
  min-width:76px;
}
.hcp small { display:block; color:var(--muted); font-size:.6rem; letter-spacing:.13em }
.hcp strong { font-size:1.6rem }
dl { margin:24px 0 }
dl div {
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  font-size:.85rem;
}
dt { color:var(--muted) }
dd { text-align:right; margin:0 }
.honors { padding:0; list-style:none; margin:18px 0 0 }
.honors li { border-top:1px solid var(--line); padding:12px 0; font-size:.86rem }
.honors li::before { content:"✦"; color:var(--gold); margin-right:10px }

/* Historie */
.timeline { display:grid; gap:20px }
.archive-card {
  display:grid;
  grid-template-columns:120px minmax(0,1fr) auto;
  align-items:center;
  gap:26px;
}
.year { font-size:3rem; font-family:Georgia,serif; color:var(--gold) }
.archive-card h3 { margin-bottom:10px }
.archive-card p { margin:0; color:var(--muted); font-size:.87rem }
.archive-details { margin-top:24px }
.archive-details summary { cursor:pointer; color:var(--gold); padding:10px 0 }
.notice {
  padding:18px 22px;
  border-left:3px solid var(--gold);
  background:var(--surface);
  border-radius:0 10px 10px 0;
  color:var(--muted);
  font-size:.88rem;
  margin:22px 0;
}
.empty { padding:50px 24px; text-align:center }
.empty h2 { color:var(--gold); font-size:4rem; margin-bottom:15px }
.table-wrap { overflow:auto }
table { width:100%; border-collapse:collapse; font-size:.85rem }
th,td { text-align:left; padding:14px 12px; border-bottom:1px solid var(--line) }
th { color:var(--muted); font-weight:500; white-space:nowrap }
td a { color:var(--gold) }
.chart { width:100%; height:auto; display:block; margin-top:22px }
.chart text { fill:var(--muted); font-size:12px }
.chart-key { display:flex; flex-wrap:wrap; gap:22px; font-size:.8rem; margin-top:15px }
.prose { max-width:800px }
.prose p,.prose li { color:var(--muted) }
.prose h2 { margin-top:38px; font-size:1.8rem }
.prose li { margin:9px 0 }
footer { border-top:1px solid var(--line); padding:35px 0 }
.footer-row { display:flex; flex-wrap:wrap; justify-content:space-between; gap:22px }
.footer-links { display:flex; flex-wrap:wrap; gap:22px; color:var(--muted); font-size:.8rem }
.footer-caption { color:var(--muted); font-size:.73rem; margin:20px 0 0 }

@media(min-width:900px) {
  .hero { min-height:570px }
}
@media(max-width:1000px) {
  .header-row { flex-wrap:wrap; padding:20px 0; gap:16px }
  nav { order:3; width:100%; overflow-x:auto; gap:24px; padding-bottom:4px }
  nav a { white-space:nowrap }
  .hero { gap:30px }
  .grid.four { grid-template-columns:repeat(2,minmax(0,1fr)) }
}
@media(max-width:720px) {
  .container { width:calc(100% - 32px) }
  .hero { grid-template-columns:1fr; padding:45px 0 30px; gap:30px }
  .hero h1 { font-size:clamp(2.7rem,12vw,3.6rem) }
  .hero p { max-width:none }
  .hero-right { gap:22px }
  .trophy-image { height:230px }
  .hero-trophy::before { height:220px }
  .grid.two,.grid.three { grid-template-columns:1fr }
  .scoreboard { padding:23px }
  .score-number { font-size:clamp(2rem,9vw,3.7rem) }
  .section { margin-top:42px }
  .page-head { padding-top:40px }
  .match { grid-template-columns:36px minmax(0,1fr); gap:12px; padding:19px }
  .match-result { grid-column:2; text-align:left }
  .match-result strong { font-size:1.15rem }
  .section-title { align-items:start }
  .archive-card { grid-template-columns:1fr; gap:14px }
  .archive-card .btn { justify-self:start }
  .profile-photo { height:350px }
  .profile-body { padding:23px }
  .stat-value { font-size:1.9rem }
  .card { padding:22px }
  .profile { padding:0 }
}
@media(max-width:380px) {
  .grid.four { grid-template-columns:1fr }
  .profile-title { flex-wrap:wrap }
}
@media(prefers-reduced-motion:reduce) {
  html { scroll-behavior:auto }
  *,*::before,*::after { transition:none!important; animation:none!important }
}
</style>
</head>

<script>
"use strict";

/*
  DATEIEN IM GLEICHEN ORDNER:
  index.html
  JG.jpg     = Julian vor dem Wasser
  MG.jpg     = Marcel im Bett
  pokal.png  = freigestellter Pokal mit transparentem Hintergrund

  DATENPFLEGE:
  Eine Ergebniszeile:
  [Datum, Golfclub, Julian, Marcel, optionale Rundenbezeichnung]

  2025: Bruttoschläge.
  2026: Lochvorsprünge.
  Bestehende Zeilen nicht umsortieren. Neue Spieltage anhängen.

  Diese statische Version enthält keinen geschützten
  Verwaltungsbereich und keinen automatischen Excel-Import.
*/

const CONFIG = { currentSeason:2026 };

const SEASONS = {
  2024:{
    format:"Historische Saison",
    completed:true,
    champion:"Marcel Glatter"
  },
  2025:{
    format:"Bruttoschläge",
    completed:true,
    champion:"Marcel Glatter"
  },
  2026:{
    format:"Lochspiel ohne Vorgabe",
    completed:false,
    champion:null
  }
};

const DATA = {
  2024:[],
  2025:[
    ["2025-04-18","Golfclub Erftaue",83,78],
    ["2025-04-26","Golfclub Erftaue",86,86],
    ["2025-05-29","Golfclub Duvenhof",88,94],
    ["2025-06-27","Golfclub Erftaue",82,79],
    ["2025-07-13","Golfclub Erftaue",81,80],
    ["2025-07-17","Royal Antwerp Golf Club",89,85],
    ["2025-07-18","Kennemer Golf & Country Club",90,84],
    ["2025-07-19","Golfbaan Bentwound",88,92],
    ["2025-07-20","Bernardus Golfclub",94,87],
    ["2025-08-12","Golfclub Duvenhof",89,91],
    ["2025-08-18","Golfclub Erftaue",84,76],
    ["2025-08-31","Golfclub Duvenhof",95,86],
    ["2025-09-05","Golfclub Erftaue / Golf-Club Duvenhof",85,77],
    ["2025-09-06","Golfclub Erftaue / Golf-Club Duvenhof",90,79],
    ["2025-11-02","Golfclub Duvenhof",82,99],
    ["2025-11-09","Golfclub Erftaue",81,76]
  ],
  2026:[
    ["2026-03-08","Golfclub Duvenhof",2,0],
    ["2026-05-14","Golfclub Erftaue",0,7],
    ["2026-05-17","Golfclub Erftaue",0,8],
    ["2026-09-12","Golfbaan Bleijenbeek",0,6],
    ["2026-09-13","Golfbaan Golfhorst",0,2],
    ["2026-09-14","Golfclub Haus Bey",0,0,"Vormittag · 18 Loch"],
    ["2026-09-14","Golfclub Haus Bey",4,0,"Nachmittag · 18 Loch"]
  ]
};

const PLAYERS = [
  {
    name:"Julian Glatter",
    short:"Julian",
    key:"jg",
    color:"julian",
    birth:"18. Februar 1992",
    handicap:"9,6",
    text:"Julian spielt seit 2004 Golf. Nach vielen Jahren im Golfclub Erftaue wechselte er 2023 zum Golfclub Duvenhof. Fünf Titel auf der Barden Tour gehören zu seinen bisherigen Karriereerfolgen.",
    club:"Golfclub Duvenhof · seit 2023",
    otherClub:"Golfclub Erftaue · bis 2023",
    otherClubLabel:"Vorheriger Club",
    titles:["5-facher Barden Tour Champion"]
  },
  {
    name:"Marcel Glatter",
    short:"Marcel",
    key:"mg",
    color:"marcel",
    birth:"27. September 1993",
    handicap:"5,7",
    text:"Marcel spielt seit 2004 Golf und bis einschließlich 2026 im Golfclub Erftaue. Ab der Saison 2027 wechselt er zum Golfclub Duvenhof. Mit den Titeln 2024 und 2025 ist er der Titelverteidiger der Brotherhood Open 2026.",
    club:"Golfclub Erftaue · bis einschließlich 2026",
    otherClub:"Golfclub Duvenhof · ab Saison 2027",
    otherClubLabel:"Clubwechsel",
    titles:[
      "Jugendclubmeister GC Erftaue 2010 und 2011",
      "Hacker Tour Champion 2024",
      "AK30 Clubmeister GC Erftaue 2025",
      "Brotherhood Open Champion 2024 und 2025",
      "3-facher Barden Tour Champion"
    ]
  }
];

const main = document.getElementById("content");
let activeSeason = CONFIG.currentSeason;

function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function number(value,digits=0) {
  return new Intl.NumberFormat("de-DE",{
    minimumFractionDigits:digits,
    maximumFractionDigits:digits
  }).format(value);
}

function date(value) {
  return new Intl.DateTimeFormat("de-DE").format(
    new Date(value+"T12:00:00")
  );
}

function matches(year) {
  return (DATA[year] || []).map((r,i) => ({
    year,
    id:i+1,
    date:r[0],
    club:r[1],
    j:r[2],
    m:r[3],
    session:r[4] || ""
  }));
}

function winner(match) {
  if(match.j === match.m) return "draw";
  if(match.year === 2026) return match.j > match.m ? "j" : "m";
  return match.j < match.m ? "j" : "m";
}

function summary(list) {
  const result = { j:0,m:0,jWins:0,mWins:0,draw:0 };

  list.forEach(match => {
    result.j += match.j;
    result.m += match.m;
    const w = winner(match);
    if(w === "draw") result.draw++;
    else result[w+"Wins"]++;
  });

  return result;
}

function formatName(year) {
  return SEASONS[year].format;
}

function unit(year) {
  return year === 2026 ? "Lochvorsprünge" : "Schläge";
}

function dailyUnit(year) {
  return year === 2026
    ? "Lochvorsprung dieses Spieltags"
    : "Bruttoschläge dieses Spieltags";
}

function resultText(match) {
  const w = winner(match);
  if(w === "draw") return "Unentschieden";

  const name = w === "j" ? "Julian" : "Marcel";
  const margin = Math.abs(match.j-match.m);

  if(match.year === 2026) {
    return `${name} gewinnt mit ${margin} ${margin===1?"Loch":"Löchern"} Vorsprung`;
  }
  return `${name} gewinnt mit ${margin} ${margin===1?"Schlag":"Schlägen"} Vorsprung`;
}

function head(kicker,title,description="") {
  return `
    <div class="page-head">
      <span class="eyebrow">${kicker}</span>
      <h1>${title}</h1>
      ${description ? `<p>${description}</p>` : ""}
    </div>
  `;
}

function metric(label,value,note="",color="") {
  return `
    <div class="card">
      <span class="stat-label">${label}</span>
      <strong class="stat-value ${color}">${value}</strong>
      <small class="muted">${note}</small>
    </div>
  `;
}

function emptySeason(year=2024) {
  const season = SEASONS[year];

  return `
    <div class="card empty">
      <span class="eyebrow">Brotherhood Open ${year}</span>
      <h2 style="font-size:2.5rem">
        ${esc(season.champion || "Noch keine Ergebnisse")}
      </h2>
      ${season.champion ? "<p>Bestätigter Saisonsieger</p>" : ""}
      <p class="muted">

      </p>
      <a class="btn" href="#historie">Zum Siegerarchiv →</a>
    </div>
  `;
}

function scorePlayer(player,value) {
  return `
    <div>
      <img
        class="avatar ${player.key}"
        src="${player.key.toUpperCase()}.jpg"
        alt="${esc(player.name)}"
        width="77"
        height="77"
      >
      <div class="duel-name">
        ${player.short}<small>Glatter</small>
      </div>
      <div class="score-number ${player.color}">${number(value)}</div>
    </div>
  `;
}

function scoreboard(year) {
  const list = matches(year);
  if(!list.length) return emptySeason(year);

  const totals = summary(list);
  const completed = SEASONS[year].completed;
  let leader = null;

  if(totals.j !== totals.m) {
    const julianLeads = year === 2026
      ? totals.j > totals.m
      : totals.j < totals.m;
    leader = julianLeads ? "Julian" : "Marcel";
  }

  const margin = Math.abs(totals.j-totals.m);
  const marginUnit = year === 2026
    ? (margin===1 ? "Loch" : "Löchern")
    : (margin===1 ? "Schlag" : "Schlägen");

  const leadText = leader
    ? `${leader} ${completed?"gewinnt":"führt"} mit ${number(margin)} ${marginUnit} Vorsprung.`
    : "Gleichstand in der Gesamtwertung.";

  return `
    <div class="scoreboard">
      <div class="score-top">
        <span class="eyebrow" style="margin:0">Saison ${year}</span>
        <span class="pill">${completed?"Endergebnis":"Aktueller Stand"}</span>
      </div>
      <div class="duel">
        ${scorePlayer(PLAYERS[0],totals.j)}
        <span class="vs">vs.</span>
        ${scorePlayer(PLAYERS[1],totals.m)}
      </div>
      <div class="score-note">
        <p>${leadText}</p>
        <p class="muted">
          ${year===2026?"Kumulierte Lochvorsprünge":"Gesamte Bruttoschläge"}
          · ${list.length} Spieltage
        </p>
      </div>
    </div>
  `;
}

/* Einzelne Tagesergebnisse, keine kumulierten Werte. */
function matchCard(match) {
  return `
    <a class="match" href="#spieltag/${match.year}/${match.id}">
      <div class="match-index">${String(match.id).padStart(2,"0")}</div>

          <span class="muted">:</span>
          <span class="marcel">${match.m}</span>
        </strong>
        <small>${resultText(match)} →</small>
      </div>
    </a>
  `;
}

  `;
}

/* Kumulierte Werte nur für die Saisonübersicht. */
function cumulativeRows(year) {
  let julian=0,marcel=0;

  return matches(year).map(match => {
    julian += match.j;
    marcel += match.m;
    return {...match,cj:julian,cm:marcel};
  });
}

function chart(year) {
  const rows = cumulativeRows(year);
  const maximum = Math.max(1,...rows.flatMap(row=>[row.cj,row.cm]));
  const x = index => 45+index*610/Math.max(1,rows.length);
  const y = value => 205-value/maximum*165;

  const points = key => [
    `${x(0)},${y(0)}`,
    ...rows.map((row,index)=>`${x(index+1)},${y(row[key])}`)
  ].join(" ");

  return `
    <svg
      class="chart"
      viewBox="0 0 700 250"
      role="img"
      aria-label="Kumulierte ${unit(year)} im Saisonverlauf. Die genauen Werte stehen in der folgenden Tabelle."
    >
      <line x1="45" y1="205" x2="665" y2="205" stroke="#536158"/>
      <line x1="45" y1="40" x2="665" y2="40" stroke="#35443d" stroke-dasharray="4 6"/>
      <text x="45" y="26">${number(maximum)} ${unit(year)}</text>
      <polyline points="${points("cj")}" fill="none" stroke="#a7caff" stroke-width="3"/>
      <polyline points="${points("cm")}" fill="none" stroke="#9bddbd" stroke-width="3" stroke-dasharray="7 4"/>
      ${rows.map((row,index)=>`
        <text x="${x(index+1)}" y="228" text-anchor="middle">${row.id}</text>
      `).join("")}
      <text x="350" y="248" text-anchor="middle">Spieltag</text>
    </svg>
    <div class="chart-key">
      <span class="julian">━━ Julian</span>
      <span class="marcel">┄┄ Marcel</span>
    </div>
  `;
}

}

function matchDays(year) {
  const list = matches(year);
  const heading = head(
    `Saison ${year} · ${list.length} dokumentierte Spieltage`,
    "Jedes Duell zählt.",
    "Alle Ergebnisse. Alle Plätze. Jeder Spieltag einzeln."

  if(!list.length) return heading+emptySeason(year);

  return heading+`
    <div class="filters">
      <label>
        Ergebnis
        <select id="winner-filter">
          <option value="all">Alle Spieltage</option>

        </select>
      </label>
      <label>

        <select id="sort-filter">
          <option value="desc">Neueste zuerst</option>
          <option value="asc">Älteste zuerst</option>
        </select>
      </label>
    </div>

      Ergebnisreihenfolge: Julian : Marcel · ${dailyUnit(year)}
      · Keine kumulierten Ergebnisse
    </p>
    <div id="match-results" class="match-list" aria-live="polite"></div>
  `;
}

function filterMatches(year) {
  const filter = document.getElementById("winner-filter").value;
  const sort = document.getElementById("sort-filter").value;
  const list = matches(year).filter(match=>filter==="all"||winner(match)===filter);

  if(sort==="desc") list.reverse();

  document.getElementById("match-results").innerHTML =
    list.length
      ? list.map(matchCard).join("")
      : '<p class="notice">Für diesen Filter gibt es keine Spieltage.</p>';
}

function matchDetail(year,id) {
  const list = matches(year);
  const match = list.find(item=>item.id===id);
  if(!match) return notFound();

  return head(
    `Saison ${year} · Spieltag ${id}`,
    esc(match.club),
    `${date(match.date)}${match.session?" · "+esc(match.session):""}`
  )+`
    <div class="card">
      <span class="pill">${formatName(year)}</span>
      <div class="duel">
        ${scorePlayer(PLAYERS[0],match.j)}
        <span class="vs">vs.</span>
        ${scorePlayer(PLAYERS[1],match.m)}
      </div>
      <h2 style="text-align:center;font-size:1.7rem">${resultText(match)}</h2>
      <p class="muted" style="text-align:center">${dailyUnit(year)}</p>
    </div>

    <div class="grid two section">
      ${metric(
        "Ergebnis dieses Spieltags",

          ${year===2026
            ? "Lochspiel ohne Vorgabe. Angezeigt wird ausschließlich das bestätigte Ergebnis dieses Spieltags."
            : "Die Ergebnisse dieses Spieltags wurden unverändert aus der Turnierliste übernommen."}
        </p>
        <p class="muted">
          Einzelne Lochwerte, ein Spielbericht und Spieltagsfotos sind nicht hinterlegt.
        </p>
      </div>
    </div>

    <div class="actions">
      ${id>1?`
        <a class="btn" href="#spieltag/${year}/${id-1}">← Vorheriger Spieltag</a>
      `:""}
      <a class="btn" href="#spieltage/${year}">Alle Spieltage</a>
      ${id<list.length?`
        <a class="btn" href="#spieltag/${year}/${id+1}">Nächster Spieltag →</a>
      `:""}
    </div>
  `;
}

function longestStreak(list,key) {
  let best=0,current=0,previousYear=null;

  list.forEach(match=>{
    if(previousYear!==match.year) current=0;
    current=winner(match)===key?current+1:0;
    best=Math.max(best,current);
    previousYear=match.year;
  });

  return best;
}

function recordCard(year,key) {
  const list = matches(year);
  if(!list.length) return "";

  const player = PLAYERS[key==="j"?0:1];
  const best = year===2026
    ? Math.max(...list.map(match=>match[key]))
    : Math.min(...list.map(match=>match[key]));
  const records = list.filter(match=>match[key]===best);

  return `
    <div class="card">
      <span class="eyebrow">${player.short} · ${year}</span>
      <h3>
        ${year===2026
          ? "Größter dokumentierter Lochspielvorsprung"
          : "Niedrigstes dokumentiertes Ergebnis"}
      </h3>
      <strong class="stat-value ${player.color}">
        ${best}
        <span style="font-size:1rem;letter-spacing:0">
          ${year===2026?"Löcher Vorsprung":"Schläge"}
        </span>
      </strong>
      ${records.map(match=>`
        <p style="margin:13px 0 0;font-size:.82rem">
          <a class="text-link" href="#spieltag/${year}/${match.id}">
            ${date(match.date)} · ${esc(match.club)}
            ${match.session?" · "+esc(match.session):""} ↗
          </a>
        </p>
      `).join("")}
    </div>
  `;
}

function statistics(year,all=false) {
  const list = all?[...matches(2025),...matches(2026)]:matches(year);
  const totals = summary(list);
  const years = all?[2025,2026]:[year];

  let html = head(
    "Zahlen hinter der Rivalität",
    "Runden, die bleiben.",
    "Bestleistungen werden nur innerhalb des jeweiligen Wertungsformats verglichen."
  );

  html += `
    <div class="filters">
      <label>
        Zeitraum
        <select id="stats-scope">
          <option value="season" ${!all?"selected":""}>Saison ${year}</option>
          <option value="all" ${all?"selected":""}>Dokumentierte Historie</option>
        </select>
      </label>
    </div>
  `;

  if(!list.length) return html+emptySeason(year);

  html += `
    ${all?`
      <p class="notice">
        Diese Bilanz umfasst die ${list.length} dokumentierten Spieltage 2025 und 2026.
        Spieltagsdaten für 2024 fehlen.
        Siegesserien werden innerhalb einzelner Saisons ermittelt.
      </p>
    `:""}

    <div class="grid four">
      ${metric("Julian · Spieltagssiege",totals.jWins,"Dokumentierte Ergebnisse","julian")}
      ${metric("Marcel · Spieltagssiege",totals.mWins,"Dokumentierte Ergebnisse","marcel")}
      ${metric("Unentschieden",totals.draw,"Dokumentierte Ergebnisse")}
      ${metric(
        "Spieltagssiege in Folge",
        `${longestStreak(list,"j")} / ${longestStreak(list,"m")}`,
        "Julian / Marcel · längste Serie"
      )}
    </div>
  `;

  years.forEach(selectedYear=>{
    const seasonMatches=matches(selectedYear);
    if(!seasonMatches.length) return;
    const seasonTotals=summary(seasonMatches);

    html += `
      <section class="section">
        <div class="section-title">
          <h2>${selectedYear} · ${selectedYear===2026?"Lochspiel":"Bruttoschläge"}</h2>
        </div>
        <div class="grid two">
          ${recordCard(selectedYear,"j")}
          ${recordCard(selectedYear,"m")}
        </div>

        ${selectedYear===2025?`
          <div class="grid two" style="margin-top:20px">
            ${metric(
              "Julian · Durchschnitt",
              number(seasonTotals.j/seasonMatches.length,2),
              "Schläge je eingetragenem Spieltag",
              "julian"
            )}
            ${metric(
              "Marcel · Durchschnitt",
              number(seasonTotals.m/seasonMatches.length,2),
              "Schläge je eingetragenem Spieltag",
              "marcel"
            )}
          </div>
          <p class="caption" style="margin-top:14px">
            Die Durchschnittswerte beziehen sich auf die eingetragenen Ergebnisse,
            nicht auf einen normalisierten 18-Loch-Schnitt.
          </p>
        `:""}
      </section>
    `;
  });

  return html;
}

            <p>Bruttoschläge · ${matches(2025).length} dokumentierte Spieltage</p>
          </div>
          <a class="btn" href="#saison/2025">Zur Saisonübersicht →</a>
        </div>
        ${historicalMatches(2025)}
      </article>

      <article class="card archive-card">
        <div class="year">2024</div>
        <div>
          <span class="eyebrow">Champion</span>
          <h3>Marcel Glatter</h3>
          <p>Bestätigter Saisonsieger. Detaillierte Spieltagsergebnisse liegen noch nicht vor.</p>
        </div>
        <a class="btn" href="#saison/2024">Zur Saison →</a>
      </article>
    </div>
  `;
}

function rulesPage() {
  return head("Regeln & Format","Ein Duell. Klare Unterschiede.")+`
    <div class="prose">
      <h2>2026 · Lochspiel ohne Vorgabe</h2>
      <p>
        Jedes Loch wird einzeln gespielt. Der Spieler mit der niedrigeren
        Schlagzahl gewinnt das Loch. Bei gleicher Schlagzahl wird das Loch
        geteilt. Es gibt keine Handicap-Vorgabe.
      </p>
      <p>
        Das eingetragene Spieltagsergebnis zeigt, wer mit wie vielen Löchern
        Vorsprung gewonnen hat. Ein Ergebnis von 0 : 7 bedeutet beispielsweise,
        dass Marcel mit sieben Löchern Vorsprung gewonnen hat.
        0 : 0 steht für ein Unentschieden.
      </p>
      <p>
        Die Saisonübersicht addiert die eingetragenen Lochvorsprünge je Spieler.
        Spieltagssiege werden separat ausgewiesen.
      </p>

      <h2>2025 · Bruttoschläge</h2>
      <p>
        Die dokumentierten Bruttoschläge werden unverändert übernommen und addiert.
        Die niedrigere Schlagzahl ist besser.
        Sonderkommentare aus der Liste führen auf Wunsch der Veranstalter
        zu keinen zusätzlichen Anpassungen.
      </p>

      <h2>Tagesergebnisse und Gesamtstand</h2>
      <p>
        Unter „Spieltage“, in den Spieltagsdetails und im Siegerarchiv
        wird ausschließlich das Ergebnis des jeweiligen Tages angezeigt.
        Auf der Startseite und in der Saisonübersicht steht zusätzlich
        der kumulierte Saisonstand.
      </p>

      <h2>Rekorde & Vergleichbarkeit</h2>
      <p>
        Bruttoschläge und Lochspielvorsprünge werden nicht zu einer gemeinsamen
        Leistungskennzahl vermischt. Rekorde heißen „dokumentierte Bestleistungen“,
        da für 2024 keine einzelnen Ergebnisse vorliegen.
      </p>

      <h2>Saisonabschluss & Gleichstand</h2>
      <p>
        2024 und 2025 sind als abgeschlossene Saisons mit Marcel als Sieger hinterlegt.
        Für 2026 wird der aktuelle Stand angezeigt. Eine Saisonabschlussregel
        und eine Entscheidung bei Gleichstand am Saisonende sind noch nicht hinterlegt.
      </p>
      <p>
        Regeln zu abgesagten oder abgebrochenen Spieltagen sind ebenfalls
        noch nicht dokumentiert.
      </p>
    </div>
  `;
}

function datesPage() {
  return head("Der nächste Spieltag","Das nächste Kapitel.")+`
    <div class="card empty">
      <span class="eyebrow">Zukünftiger Termin</span>
      <h2>TBD</h2>
      <p class="muted">
        Datum, Uhrzeit und Austragungsort werden noch festgelegt.
      </p>
      <a class="btn" href="#spieltage/${CONFIG.currentSeason}">
        Bisherige Spieltage ansehen →
      </a>

function aboutPage() {
  return head("Über die Brotherhood Open","Eine Familie.<br>Eine Golftradition.")+`
    <div class="prose">
      <p>
        Die Brotherhood Open sind das jährliche Golfduell zwischen Julian Glatter
        und Marcel Glatter. Seit 2024 treffen die beiden Brüder im Rahmen
        dieses Wettbewerbs aufeinander.
      </p>
      <p>
        Diese Website hält die dokumentierten Spieltage fest, zeigt den

      <h2>Zwei Brüder. Ein Titel.</h2>

        Seit 2026 wird im Lochspiel ohne Vorgabe gespielt.
      </p>
      <div class="actions">
        <a class="btn primary" href="#spieler">Die Spieler kennenlernen</a>
        <a class="btn" href="#historie">Zum Siegerarchiv</a>

function notFound() {
  return head("Seite nicht gefunden","Hier liegt kein Ball.")+`
    <p class="muted">Diese Seite oder dieser Spieltag ist nicht vorhanden.</p>
    <a class="btn primary" href="#start/${CONFIG.currentSeason}">
      Zur Startseite
    </a>
  `;
}

/* Fehlende Spielerbilder und fehlendes Pokalbild getrennt behandeln. */
function installImageFallbacks() {
  main.querySelectorAll("img.avatar, img.profile-photo").forEach(image=>{
    const replaceImage = ()=>{
      if(!image.isConnected) return;

      const replacement=document.createElement("div");
      replacement.className=image.className+" image-placeholder";
      replacement.textContent=image.classList.contains("jg")?"JG":"MG";
      replacement.setAttribute("role","img");
      replacement.setAttribute("aria-label",image.alt+" – Profilbild fehlt");
      image.replaceWith(replacement);
    };

    image.addEventListener("error",replaceImage,{once:true});

    if(image.complete&&image.naturalWidth===0) {
      replaceImage();
    }
  });

  const trophy=main.querySelector(".trophy-image");

  if(trophy) {
    const replaceTrophy=()=>{
      if(!trophy.isConnected) return;

      const placeholder=document.createElement("div");
      placeholder.className="trophy-placeholder";
      placeholder.textContent=
        "Pokalbild noch nicht verfügbar. Bitte den freigestellten Pokal als pokal.png im Website-Ordner speichern.";
      trophy.replaceWith(placeholder);
    };

    trophy.addEventListener("error",replaceTrophy,{once:true});

    if(trophy.complete&&trophy.naturalWidth===0) {
      replaceTrophy();
    }
  }
}

function render() {
  const rawHash=location.hash.slice(1);
  const parts=(rawHash==="content"?"":rawHash).split("/");
  const page=parts[0]||"start";
  const requestedYear=Number(parts[1]);
  const hasYear=Object.prototype.hasOwnProperty.call(SEASONS,requestedYear);
  const year=hasYear?requestedYear:activeSeason;

  const seasonalPages=["start","saison","spieltage","statistiken","spieltag"];
  const invalidYear=seasonalPages.includes(page)&&Boolean(parts[1])&&!hasYear;

  activeSeason=year;
  document.getElementById("season").value=String(year);

  document.querySelectorAll("[data-home]").forEach(link=>{
    link.href=`#start/${CONFIG.currentSeason}`;
  });

  const navigation=[
    ["start","Übersicht"],
    ["saison","Saison"],
    ["spieltage","Spieltage"],
    ["statistiken","Statistiken"],
    ["historie","Historie"],
    ["spieler","Spieler"]
  ];

  document.getElementById("navigation").innerHTML=navigation.map(([key,label])=>{
    const suffix=seasonalPages.includes(key)?"/"+year:"";
    const current=page===key||(page==="spieltag"&&key==="spieltage");

    return `
      <a href="#${key}${suffix}" ${current?'aria-current="page"':""}>
        ${label}
      </a>
    `;
  }).join("");

  const views={
    start:()=>start(year),
    saison:()=>seasonPage(year),
    spieltage:()=>matchDays(year),
    spieltag:()=>matchDetail(year,Number(parts[2])),
    statistiken:()=>statistics(year,parts[2]==="alle"),
    historie:historyPage,
    spieler:profiles,
    regeln:rulesPage,
    termine:datesPage,
    ueber:aboutPage
  };

  main.innerHTML=invalidYear
    ? notFound()
    : (views[page]||notFound)();

  const titleMap={
    start:"Zwei Brüder. Ein Titel.",
    saison:`Saison ${year}`,
    spieltage:`Spieltage ${year}`,
    spieltag:`Spieltag ${Number(parts[2])||""} · ${year}`,
    statistiken:"Statistiken",
    historie:"Siegerarchiv",
    spieler:"Die Spieler",
    regeln:"Regeln & Format",
    termine:"Termine",
    ueber:"Über das Turnier"
  };

  document.title=`${
    invalidYear?"Seite nicht gefunden":titleMap[page]||"Seite nicht gefunden"
  } — Brotherhood Open`;

  if(!invalidYear&&page==="spieltage"&&matches(year).length) {
    filterMatches(year);

    document.getElementById("winner-filter").addEventListener(
      "change",()=>filterMatches(year)
    );
    document.getElementById("sort-filter").addEventListener(
      "change",()=>filterMatches(year)
    );
  }

  const statsScope=document.getElementById("stats-scope");
  if(statsScope) {
    statsScope.addEventListener("change",event=>{
      location.hash=`statistiken/${year}${
        event.target.value==="all"?"/alle":""
      }`;
    });
  }

  installImageFallbacks();
}

document.getElementById("season").addEventListener("change",event=>{
  const year=Number(event.target.value);
  const parts=location.hash.slice(1).split("/");
  const page=parts[0]||"start";
  const target=["start","saison","spieltage","statistiken"].includes(page)
    ? page
    : "saison";

  const scope=target==="statistiken"&&parts[2]==="alle"?"/alle":"";
  location.hash=`${target}/${year}${scope}`;
});

document.querySelector(".skip").addEventListener("click",event=>{
  event.preventDefault();
  main.focus();
  main.scrollIntoView({block:"start"});
});

window.addEventListener("hashchange",()=>{
  render();
  window.scrollTo(0,0);
  main.focus({preventScroll:true});
});

render();
</script>
